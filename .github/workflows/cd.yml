name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: ["main", "master"]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client for production
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # ─── Replace the step below with your actual deployment commands ──────────
      # Examples:
      #   • Render / Railway / Fly.io  → use their official GitHub Actions
      #   • AWS S3 + CloudFront        → aws s3 sync build/ s3://your-bucket
      #   • Docker + registry          → docker build & push
      # ─────────────────────────────────────────────────────────────────────────
      - name: Deploy (placeholder)
        run: |
          echo "✅ CI passed. Add your deployment commands here."
          echo "Client build is ready in client/build/"
          echo "Server is ready in server/"
